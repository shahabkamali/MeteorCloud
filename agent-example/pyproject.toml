[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-agent"
version = "0.1.0"
description = "Reference Linux agent for the Edge Platform fleet"
readme = "README.md"
requires-python = ">=3.11"
# The reference agent intentionally depends only on the Python standard library
# so it can run on minimal Linux devices without installing packages.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
edge-agent = "edge_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["edge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
