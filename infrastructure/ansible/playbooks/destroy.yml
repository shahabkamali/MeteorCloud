- name: Destroy enabled services
  hosts: platform
  become: true
  tasks:
    - name: Stop WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: stopped
        enabled: false
      failed_when: false
      when: "'vpn' in enabled_services"

    - name: Stop Docker Compose stack
      ansible.builtin.command:
        cmd: docker compose -f /opt/edge-platform/docker-compose.yml down -v
      failed_when: false
      when: "'cloud_app' in enabled_services"
