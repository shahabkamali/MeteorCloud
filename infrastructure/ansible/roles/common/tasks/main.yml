---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - unzip
    state: present

- name: Set timezone to UTC
  ansible.builtin.command:
    cmd: timedatectl set-timezone UTC
  failed_when: false
