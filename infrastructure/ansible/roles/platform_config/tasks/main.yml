---
- name: Render platform environment file
  ansible.builtin.template:
    src: platform.env.j2
    dest: /opt/edge-platform/config/platform.env
    owner: root
    group: root
    mode: "0600"

- name: Render production Docker Compose file
  ansible.builtin.template:
    src: docker-compose.production.yml.j2
    dest: /opt/edge-platform/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Render Traefik static configuration
  ansible.builtin.template:
    src: traefik/traefik.yml.j2
    dest: /opt/edge-platform/traefik/traefik.yml
    owner: root
    group: root
    mode: "0644"

- name: Render Traefik dynamic configuration
  ansible.builtin.template:
    src: traefik/dynamic.yml.j2
    dest: /opt/edge-platform/traefik/dynamic.yml
    owner: root
    group: root
    mode: "0644"

- name: Ensure ACME storage exists
  ansible.builtin.file:
    path: /opt/edge-platform/traefik/acme.json
    state: touch
    mode: "0600"
