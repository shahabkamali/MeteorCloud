---
- name: Create platform directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/edge-platform, mode: "0755" }
    - { path: /opt/edge-platform/config, mode: "0750" }
    - { path: /opt/edge-platform/data, mode: "0750" }
    # postgres:16-alpine runs as UID/GID 70
    - { path: /opt/edge-platform/data/postgres, mode: "0700", owner: "70", group: "70" }
    - { path: /opt/edge-platform/data/redis, mode: "0750" }
    # prom/prometheus runs as nobody (65534); TSDB lives at /prometheus
    - { path: /opt/edge-platform/data/prometheus, mode: "0750", owner: "65534", group: "65534" }
    - { path: /opt/edge-platform/traefik, mode: "0750" }
    - { path: /opt/edge-platform/backups, mode: "0750" }
    - { path: /opt/edge-platform/src, mode: "0755" }
