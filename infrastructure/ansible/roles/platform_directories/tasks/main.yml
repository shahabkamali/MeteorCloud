---
- name: Create platform directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/edge-platform, mode: "0755" }
    - { path: /opt/edge-platform/config, mode: "0750" }
    - { path: /opt/edge-platform/data, mode: "0750" }
    - { path: /opt/edge-platform/data/postgres, mode: "0750" }
    - { path: /opt/edge-platform/data/redis, mode: "0750" }
    - { path: /opt/edge-platform/traefik, mode: "0750" }
    - { path: /opt/edge-platform/backups, mode: "0750" }
